name: Odoo CI/CD

on:
  push:
    branches:
      - main
      - staging

  pull_request:
    branches:
      - main
      - staging

jobs:
  odoo-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      HOST: localhost
      PORT: 5432
      USER: odoo
      PASSWORD: odoo

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            python3-dev \
            libpq-dev \
            libxml2-dev \
            libxslt1-dev \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev \
            zlib1g-dev \
            libjpeg-dev \
            libffi-dev \
            liblcms2-dev \
            libblas-dev \
            libatlas-base-dev \
            node-less \
            npm \
            git

          sudo npm install -g rtlcss

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install \
            flake8 \
            pylint-odoo \
            psycopg2-binary

      - name: Check Odoo binary
        run: |
          chmod +x odoo-bin
          ./odoo-bin --version

      - name: Run flake8
        run: |
          if [ -d addons ]; then
            flake8 addons --max-line-length=120
          fi

      - name: Run Odoo tests
        run: |
          ./odoo-bin \
            -d test_db \
            --db_host=$HOST \
            --db_port=$PORT \
            --db_user=$USER \
            --db_password=$PASSWORD \
            --addons-path=addons \
            --test-enable \
            --stop-after-init \
            --without-demo=all

  deploy:
    needs: odoo-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /home/odoo18test2/product/odoo18

            git pull origin main

            docker compose down
            docker compose up -d --build

            docker ps